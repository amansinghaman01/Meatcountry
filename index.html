<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b2e"><title>FreshCart Market</title><style>body{font:16px system-ui;background:#f7f7f2;color:#173b2e;display:grid;place-items:center;min-height:100vh;margin:0}.loading{padding:24px;text-align:center}small{color:#65776d}</style></head><body><div class="loading"><h2>FreshCart Market</h2><p>Loading your storefront…</p><small>Please keep this page open.</small></div><script>(async()=>{try{if(!('DecompressionStream'in window))throw new Error('This browser does not support compressed storefront loading.');const names=Array.from({length:7},(_,i)=>`part${i+1}.txt`);const parts=await Promise.all(names.map(async name=>{const r=await fetch('/app-bundle/'+name,{cache:'force-cache'});if(!r.ok)throw new Error('Storefront bundle part could not be loaded ('+name+').');return r.text()}));const binary=atob(parts.join('').replace(/\s/g,''));const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(error){document.querySelector('.loading').innerHTML='<h2>FreshCart is temporarily unavailable</h2><p>'+String(error.message||error)+'</p><small>Refresh the page or try the latest Chrome browser.</small>';console.error(error)}})();</script></body></html>
